<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Parts Anatomy</title>
    <script src="bodyRegions.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        svg.anatomy-svg {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
        }
        .outline-path {
            fill: #1c1e24;
            stroke: rgba(197, 204, 214, 0.4);
            stroke-width: 3.5px;
        }
        .fragment-path {
            fill: #2a2f3a;
            stroke: #121317;
            stroke-width: 1.5px;
            cursor: pointer;
            transition: fill 0.2s ease, filter 0.2s ease, stroke 0.2s ease;
        }
        .fragment-path:hover {
            fill: #454d5d;
        }
        .fragment-path.active {
            fill: #5B8DEF;
            stroke: #a0c2ff;
            stroke-width: 2.5px;
            filter: drop-shadow(0 0 10px rgba(91, 141, 239, 0.9));
        }
    </style>
</head>
<body>

    <svg id="anatomySvg" viewBox="0 0 724 1448" class="anatomy-svg">
        <!-- Body Outline Path -->
        <path id="outlinePath" class="outline-path" d="" />

        <!-- Muscle Fragment Paths -->
        <g id="fragmentsGroup"></g>
    </svg>

    <script>
        let currentGender = 'male';
        let currentView = 'front';
        let selectedGroups = new Set(['chest', 'biceps', 'quadriceps']);

        function renderAnatomy() {
            if (!window.BODY_REGIONS) return;
            const data = window.BODY_REGIONS[currentGender][currentView];
            const svg = document.getElementById('anatomySvg');
            const outlinePath = document.getElementById('outlinePath');
            const fragmentsGroup = document.getElementById('fragmentsGroup');

            svg.setAttribute('viewBox', data.viewBox);
            outlinePath.setAttribute('d', data.outlineD);

            fragmentsGroup.innerHTML = '';

            data.fragments.forEach(frag => {
                const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                p.setAttribute('d', frag.pathData);
                p.setAttribute('data-group', frag.parentSlug);
                p.setAttribute('data-slug', frag.slug);
                p.classList.add('fragment-path');

                if (selectedGroups.has(frag.parentSlug)) {
                    p.classList.add('active');
                }

                p.onclick = (e) => {
                    e.stopPropagation();
                    toggleMuscleGroup(frag.parentSlug);
                };

                fragmentsGroup.appendChild(p);
            });
        }

        function toggleMuscleGroup(group) {
            if (selectedGroups.has(group)) {
                selectedGroups.delete(group);
            } else {
                selectedGroups.add(group);
            }

            document.querySelectorAll(`.fragment-path[data-group="${group}"]`).forEach(p => {
                if (selectedGroups.has(group)) {
                    p.classList.add('active');
                } else {
                    p.classList.remove('active');
                }
            });
        }

        function setGender(gender) {
            currentGender = gender;
            renderAnatomy();
        }

        function toggleView() {
            currentView = (currentView === 'front') ? 'back' : 'front';
            renderAnatomy();
            return currentView;
        }

        function clearAll() {
            selectedGroups.clear();
            document.querySelectorAll('.fragment-path').forEach(p => p.classList.remove('active'));
        }

        // Initial setup
        renderAnatomy();
    </script>
</body>
</html>
